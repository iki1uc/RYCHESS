<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♟️ SCHACH-HISTORIEN · TOP 100 · THEMEN · KULTUR</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background: #0a0a12;
  color: #c8d0d0;
  font-family: 'Georgia', 'Times New Roman', serif;
  min-height: 100vh;
  padding: 16px;
  background-image: radial-gradient(circle at 20% 30%, #1a1a2a, #0a0a12);
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
.header {
  text-align: center;
  padding: 20px 0 10px;
  border-bottom: 1px solid rgba(255,170,0,0.1);
  margin-bottom: 20px;
}
.header h1 {
  font-size: 28px;
  background: linear-gradient(90deg, #ffaa00, #ff4444, #4444ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
}
.header .sub {
  color: #666;
  font-size: 13px;
  font-style: italic;
  margin-top: 4px;
}
.header .sub span { color: #ffaa00; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  justify-content: center;
}
.toolbar button, .toolbar select {
  background: #111;
  color: #c8d0d0;
  border: 1px solid #2a2a3a;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  transition: all 0.3s;
}
.toolbar button:hover { background: #1a1a2a; border-color: #ffaa00; }
.toolbar button.active { background: #2a2a3a; border-color: #ffaa00; color: #ffaa00; }
.toolbar select { background: #111; cursor: pointer; }
.toolbar select option { background: #111; }

.main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

.game-list {
  background: rgba(10,10,20,0.6);
  border: 1px solid #1a1a2a;
  border-radius: 12px;
  padding: 12px;
  max-height: 500px;
  overflow-y: auto;
}
.game-list::-webkit-scrollbar { width: 4px; }
.game-list::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
.game-list .item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 4px;
}
.game-list .item:hover { background: rgba(255,170,0,0.05); }
.game-list .item .name { color: #ddd; font-size: 13px; }
.game-list .item .year { color: #666; font-size: 11px; }
.game-list .item .tags { color: #ffaa00; font-size: 10px; }
.game-list .item .emotion { font-size: 16px; }

.detail-panel {
  background: rgba(10,10,20,0.6);
  border: 1px solid #1a1a2a;
  border-radius: 12px;
  padding: 16px;
  min-height: 300px;
}
.detail-panel .title {
  font-size: 18px;
  color: #ffaa00;
  margin-bottom: 4px;
}
.detail-panel .meta {
  color: #666;
  font-size: 12px;
  margin-bottom: 8px;
}
.detail-panel .meta span { color: #ffaa00; }
.detail-panel .moves {
  font-family: 'Consolas', monospace;
  font-size: 13px;
  color: #88ddbb;
  line-height: 1.6;
  max-height: 250px;
  overflow-y: auto;
  background: rgba(0,0,0,0.3);
  padding: 10px;
  border-radius: 6px;
}
.detail-panel .analysis {
  margin-top: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.2);
  border-radius: 6px;
  font-size: 13px;
  color: #aab;
  line-height: 1.6;
  border-left: 3px solid #ffaa00;
}
.detail-panel .analysis .highlight { color: #ffaa00; }
.detail-panel .analysis .emotion { color: #ff4444; }

.io-bar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.io-bar button {
  background: #111;
  color: #c8d0d0;
  border: 1px solid #2a2a3a;
  padding: 5px 12px;
  border-radius: 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  transition: all 0.3s;
}
.io-bar button:hover { background: #1a1a2a; border-color: #ffaa00; }
.io-bar input[type="file"] { display: none; }

.footer {
  text-align: center;
  margin-top: 20px;
  color: #333;
  font-size: 11px;
  letter-spacing: 1px;
}
.footer span { color: #ffaa00; }
</style>
</head>
<body>

<div class="container">

<div class="header">
  <h1>♟️ SCHACH-HISTORIEN</h1>
  <div class="sub">TOP 100 · THEMENSORTIERT · <span>KULTUR · GLÜCK · ANALYSE</span></div>
</div>

<div class="toolbar">
  <button class="active" data-filter="all">📚 Alle</button>
  <button data-filter="pferd">🐴 Pferde-Züge</button>
  <button data-filter="laufer">♝ Läufer-Liebhaber</button>
  <button data-filter="schafer">🐑 Schäferzug</button>
  <button data-filter="opfer">💥 Opfer</button>
  <button data-filter="remis">⚖️ Remis</button>
  <select id="sortSelect">
    <option value="year">Sortieren nach Jahr</option>
    <option value="name">Sortieren nach Name</option>
    <option value="popular">Sortieren nach Beliebtheit</option>
  </select>
  <button id="btnTop10">🔝 Top 10</button>
  <button id="btnTop20">🔝 Top 20</button>
</div>

<div class="main">
  <div class="game-list" id="gameList"></div>
  <div class="detail-panel" id="detailPanel">
    <div style="color:#666; text-align:center; padding:40px 0;">
      <div style="font-size:48px; margin-bottom:12px;">♟️</div>
      <div>Wähle ein Spiel aus der Liste</div>
      <div style="font-size:12px; color:#444;">Schach ist Kultur · Geschichte · Glück</div>
    </div>
  </div>
</div>

<div class="io-bar">
  <button id="btnExport">📤 Export (JSON)</button>
  <button id="btnImport">📥 Import (JSON)</button>
  <input type="file" id="fileInput" accept=".json">
  <button id="btnRandom">🎲 Zufälliges Spiel</button>
</div>

<div class="footer">
  <span>♟️</span> SCHACH-HISTORIEN · TOP 100 · THEMENSORTIERT · <span>wieimmer4u</span>
</div>

</div>

<script>
// ============================================================
// SCHACH-HISTORIEN · TOP 100 · THEMEN · KULTUR
// ============================================================

// ===== 100 SPIELE (generiert mit Themen) =====
const THEMES = ['pferd', 'laufer', 'schafer', 'opfer', 'remis', 'könig', 'dame', 'turm', 'bauer', 'angriff', 'verteidigung'];

function generateGames(count = 100) {
  const games = [];
  const names = [
    'Die Unsterbliche', 'Die Opernpartie', 'Die Evergreen', 'Match des Jahrhunderts',
    'Kasparov vs. Deep Blue', 'Die Unsterbliche Remis', 'Der Schäferzug', 'Der Läufer-Coup',
    'Die Pferde-Tour', 'Das Opfer von Anderssen', 'Die Remis-Partie', 'Der Königsangriff',
    'Die Damen-Oper', 'Der Turm-Sprung', 'Die Bauern-Welle', 'Die Verteidigung von Berlin',
    'Der Angriff von Wien', 'Die Remis von London', 'Das Pferd von Paris', 'Der Läufer von Rom',
    'Die Schäfer von München', 'Das Opfer von Hamburg', 'Die Königskrone', 'Die Damen-Rache'
  ];

  for (let i = 0; i < count; i++) {
    const year = 1800 + Math.floor(Math.random() * 200);
    const name = names[i % names.length] + (i > 23 ? ` (${i+1})` : '');
    const theme = THEMES[i % THEMES.length];
    const moves = generateMoves(15 + Math.floor(Math.random() * 20));
    const winner = ['Weiß', 'Schwarz', 'Remis'][Math.floor(Math.random() * 3)];
    const angst = [
      'Ein atemberaubender Angriff, der bis heute unvergessen ist!',
      'Die Verteidigung hält stand – ein Meisterwerk!',
      'Ein Opfer, das die Gegner zur Verzweiflung trieb.',
      'Die Figuren tanzten – ein Spiel für die Ewigkeit.',
      'Der Schäferzug führte zum schnellen Sieg.',
      'Ein Remis, das wie ein Sieg gefeiert wurde.',
      'Die Pferde galoppierten über das Brett.',
      'Der Läufer entschied die Partie.',
      'Ein Spiel, das in die Geschichte einging.'
    ];
    const emotion = ['😱🔥', '🎭💎', '🌿💥', '❄️🔥', '🤖🧠', '⚖️😰', '🐴✨', '♝🌟', '🐑⚡', '💥🎯', '🧘✨', '🏆🔥'][i % 12];

    games.push({
      id: i,
      name,
      year,
      theme,
      moves,
      winner,
      angst: angst[i % angst.length],
      emotion,
      players: `Meister ${i+1} vs. Meister ${i+2}`
    });
  }
  return games;
}

function generateMoves(count) {
  const moves = [];
  for (let i = 0; i < count; i++) {
    const from = String.fromCharCode(97 + Math.floor(Math.random() * 8)) + (1 + Math.floor(Math.random() * 8));
    const to = String.fromCharCode(97 + Math.floor(Math.random() * 8)) + (1 + Math.floor(Math.random() * 8));
    moves.push(`${from} → ${to}`);
  }
  return moves;
}

// ===== STATE =====
let allGames = generateGames(100);
let filteredGames = [...allGames];
let selectedGame = null;
let currentFilter = 'all';
let currentSort = 'year';
let topLimit = 0;

// ===== DOM =====
const gameListEl = document.getElementById('gameList');
const detailPanelEl = document.getElementById('detailPanel');
const filterBtns = document.querySelectorAll('[data-filter]');
const sortSelect = document.getElementById('sortSelect');
const btnTop10 = document.getElementById('btnTop10');
const btnTop20 = document.getElementById('btnTop20');
const btnRandom = document.getElementById('btnRandom');
const btnExport = document.getElementById('btnExport');
const btnImport = document.getElementById('btnImport');
const fileInput = document.getElementById('fileInput');

// ===== FILTER =====
function applyFilter() {
  let result = [...allGames];

  if (currentFilter !== 'all') {
    result = result.filter(g => g.theme === currentFilter);
  }

  if (topLimit > 0) {
    result = result.slice(0, topLimit);
  }

  // Sortierung
  if (currentSort === 'year') result.sort((a, b) => a.year - b.year);
  else if (currentSort === 'name') result.sort((a, b) => a.name.localeCompare(b.name));
  else if (currentSort === 'popular') result.sort((a, b) => b.id - a.id);

  filteredGames = result;
  renderList();
}

// ===== RENDER LIST =====
function renderList() {
  gameListEl.innerHTML = '';
  filteredGames.forEach(game => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div>
        <div class="name">${game.name}</div>
        <div class="year">${game.year} · ${game.players}</div>
      </div>
      <div style="text-align:right;">
        <div class="tags">${game.theme}</div>
        <div class="emotion">${game.emotion}</div>
      </div>
    `;
    item.addEventListener('click', () => showDetail(game));
    gameListEl.appendChild(item);
  });
}

// ===== SHOW DETAIL =====
function showDetail(game) {
  selectedGame = game;
  detailPanelEl.innerHTML = `
    <div class="title">${game.name}</div>
    <div class="meta">${game.year} · ${game.players} · <span>${game.theme}</span> · ${game.emotion}</div>
    <div class="moves">${game.moves.map((m, i) => `${i+1}. ${m}`).join(' · ')}</div>
    <div class="analysis">
      <span class="highlight">📜 Ursache & Wirkung</span><br>
      ${game.angst}<br><br>
      <span class="highlight">🏆 Sieger:</span> ${game.winner}<br>
      <span class="emotion">${game.emotion}</span> · ${game.players}
    </div>
  `;
}

// ===== TOP =====
function setTop(limit) {
  topLimit = topLimit === limit ? 0 : limit;
  document.getElementById('btnTop10').classList.toggle('active', topLimit === 10);
  document.getElementById('btnTop20').classList.toggle('active', topLimit === 20);
  applyFilter();
}

// ===== RANDOM =====
function randomGame() {
  if (filteredGames.length === 0) return;
  const game = filteredGames[Math.floor(Math.random() * filteredGames.length)];
  showDetail(game);
}

// ===== EXPORT =====
function exportGames() {
  const data = JSON.stringify(allGames, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `schach_historien_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== IMPORT =====
function importGames(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data) && data.length > 0 && data[0].moves) {
        allGames = data;
        applyFilter();
        detailPanelEl.innerHTML = `
          <div style="color:#88ddbb; text-align:center; padding:20px;">
            ✅ ${data.length} Spiele erfolgreich importiert!
          </div>
        `;
      }
    } catch (err) {
      detailPanelEl.innerHTML = `
        <div style="color:#ff4444; text-align:center; padding:20px;">
          ❌ Fehler beim Import: ${err.message}
        </div>
      `;
    }
  };
  reader.readAsText(file);
}

// ===== EVENTS =====
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    topLimit = 0;
    document.getElementById('btnTop10').classList.remove('active');
    document.getElementById('btnTop20').classList.remove('active');
    applyFilter();
  });
});

sortSelect.addEventListener('change', (e) => {
  currentSort = e.target.value;
  applyFilter();
});

btnTop10.addEventListener('click', () => setTop(10));
btnTop20.addEventListener('click', () => setTop(20));
btnRandom.addEventListener('click', randomGame);
btnExport.addEventListener('click', exportGames);
btnImport.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) {
    importGames(e.target.files[0]);
    fileInput.value = '';
  }
});

// ===== TASTATUR =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') randomGame();
  if (e.key === '1') { document.querySelector('[data-filter="all"]').click(); }
  if (e.key === '2') { document.querySelector('[data-filter="pferd"]').click(); }
  if (e.key === '3') { document.querySelector('[data-filter="laufer"]').click(); }
  if (e.key === '4') { document.querySelector('[data-filter="schafer"]').click(); }
  if (e.key === '5') { document.querySelector('[data-filter="opfer"]').click(); }
  if (e.key === '6') { document.querySelector('[data-filter="remis"]').click(); }
});

// ===== INIT =====
applyFilter();
showDetail(allGames[0]);

console.log('♟️ SCHACH-HISTORIEN geladen');
console.log(`📚 ${allGames.length} Spiele · ${THEMES.length} Themen`);
console.log('⌨️  1=Alle 2=Pferd 3=Läufer 4=Schäfer 5=Opfer 6=Remis  r=Zufall');
</script>

</body>
</html>
